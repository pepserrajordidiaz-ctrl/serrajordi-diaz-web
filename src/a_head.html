<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serrajordi-Diaz · Anselm Clavé 30</title>
<meta name="description" content="Dues cases adosades d'obra nova al carrer d'Anselm Clavé, 30, a Llinars del Vallès. Recorre el solar en 3D amb el sol real de cada hora.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a scroll-driven site model (dark, full screen) that tells the story chapter by chapter, then light working sections: explorer, sun study, mortgage simulator, place and company. */
  --paper:#F1F2EE;
  --paper-2:#E5E7E1;
  --ink:#141A18;
  --night:#0E1412;
  --muted:#59645F;
  --rule:#C5CBC5;
  --accent:#EDB91F;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px clamp(16px,2.4vw,40px)}

/* ---------- header over the story ---------- */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px var(--gut);color:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font:800 19px/1 var(--display);font-stretch:72%;letter-spacing:.04em;text-transform:uppercase}
.brand span{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
.nav a{font:500 13px/1 var(--body);text-decoration:none;opacity:.82;padding:6px 0}
.nav a:hover{opacity:1}
.cta{white-space:nowrap;font:600 13px/1 var(--body);background:var(--accent);color:var(--ink)!important;opacity:1!important;padding:11px 15px!important;text-decoration:none}

/* ---------- story: sticky model + chapters ---------- */
.story{position:relative;background:var(--night);color:var(--paper)}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.host{position:absolute;inset:0}
.host canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sticky::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,20,18,.62),rgba(14,20,18,0) 120px),linear-gradient(90deg,rgba(14,20,18,.55),rgba(14,20,18,0) 46%),radial-gradient(ellipse at 60% 45%,transparent 55%,rgba(30,18,8,.28) 100%)}
.chapters{position:relative;z-index:2;margin-top:-100vh;margin-top:-100svh}
.chapter{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:96px var(--gut) 64px;pointer-events:none}
.card{pointer-events:auto;max-width:430px;background:rgba(14,20,18,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(241,242,238,.14);padding:26px 26px 24px;display:grid;gap:14px}
.card .k{font:500 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card h1{font-size:clamp(40px,5.4vw,78px);line-height:.92;font-stretch:76%;text-transform:uppercase}
.card h2{font-size:clamp(30px,3.4vw,46px);line-height:.95;font-stretch:78%;text-transform:uppercase}
.card p{font-size:16.5px;color:rgba(241,242,238,.86)}
.card b{color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:500 11.5px/1 var(--mono);border:1px solid rgba(241,242,238,.28);padding:7px 9px}
.cue{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:rgba(241,242,238,.7)}
.cue i{width:1px;height:34px;background:var(--accent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(.2);transform-origin:bottom}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font:400 13px/1.4 var(--mono);margin:0}
.dl dt{color:rgba(241,242,238,.6);margin:0}.dl dd{margin:0}
.floors{display:grid;gap:0;margin:0;padding:0;list-style:none;border-top:1px solid rgba(241,242,238,.2)}
.floors li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(241,242,238,.2);opacity:.35;transition:opacity .5s}
.floors li.on{opacity:1}
.floors b{font:700 18px/1.2 var(--display);font-stretch:80%;color:var(--accent)!important}
.small{font:400 12px/1.5 var(--mono);color:rgba(241,242,238,.62)}
.clock{font:500 30px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.rail{position:absolute;right:var(--gut);top:50%;transform:translateY(-50%);z-index:3;display:grid;gap:14px;list-style:none;margin:0;padding:14px 14px 14px 16px;background:rgba(14,20,18,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(241,242,238,.12)}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(241,242,238,.62)}
.rail a:hover{color:var(--paper)}
.rail a i{width:18px;height:2px;background:currentColor;transition:width .35s}
.rail a.on{color:var(--paper)}.rail a.on i{width:38px;background:var(--accent)}
.labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lbl.plot{font:600 13px/1.25 var(--body);background:var(--ink);color:var(--paper);padding:8px 11px 9px;border-left:6px solid var(--accent);margin-top:-34px}
.lbl.plot em{display:block;font:400 11.5px/1.3 var(--mono);font-style:normal;opacity:.8}
.lbl.plot::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:34px;background:var(--ink)}
.lbl.nb{font:500 10.5px/1 var(--mono);color:var(--ink);background:rgba(241,242,238,.88);padding:4px 6px}
.lbl.st{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:rgba(23,32,29,.8)}
.lbl.dim{font:500 12px/1 var(--mono);background:var(--accent);color:var(--ink);padding:4px 7px}
.lbl.fl{font:600 12px/1.2 var(--body);background:rgba(241,242,238,.94);color:var(--ink);padding:6px 9px;border-left:4px solid var(--accent)}
.lbl.hide{display:none}
</style>
