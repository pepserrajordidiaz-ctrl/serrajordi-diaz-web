<style>
/* ---------- light sections ---------- */
section.block{padding-block:clamp(56px,8vw,112px);border-bottom:1px solid var(--rule)}
.eyebrow{grid-column:1/-1;font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--ink);padding-top:12px}
.block h2{grid-column:1/span 7;font-size:clamp(32px,4vw,58px);line-height:.96;font-stretch:78%;text-transform:uppercase}
.lede{grid-column:8/span 5;font-size:17px;max-width:46ch;align-self:end}
.lede .s{display:block;margin-top:10px;font:400 12.5px/1.5 var(--mono);color:var(--muted)}

/* explorer */
.frame{grid-column:1/-1;border:1px solid var(--ink);background:#cfd8dc}
.stage{position:relative;height:clamp(440px,68vh,780px);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}
.stage.dragging{cursor:grabbing}
.hint{position:absolute;left:14px;top:14px;z-index:2;font:400 12px/1.4 var(--mono);color:var(--ink);background:rgba(241,242,238,.86);padding:7px 9px;max-width:320px;transition:opacity .4s}
.hint.gone{opacity:0}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:14px 20px;padding:14px;background:var(--paper);border-top:1px solid var(--ink)}
.views{display:grid;gap:8px;align-content:start}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{font:500 13px/1 var(--body);border:0;background:transparent;color:var(--ink);padding:11px 14px;cursor:pointer;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{font:500 12.5px/1 var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:9px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn .sw{width:9px;height:9px;border:1px solid currentColor}
.btn[aria-pressed="true"] .sw{background:var(--accent);border-color:var(--accent)}
.walk:not(.on){display:none}
.walk .btn{min-width:44px;justify-content:center;font-size:15px}
.sun{border:1px solid var(--ink);padding:10px 12px 12px;display:grid;gap:8px}
.chip{font:500 11.5px/1 var(--mono);border:1px solid var(--rule);background:transparent;color:var(--ink);padding:6px 8px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--accent)}
.sun label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.sun input[type=range]{flex:1;min-width:150px;accent-color:var(--ink)}
.sunread{font:400 12px/1.3 var(--mono)}
.play{font:500 12px/1 var(--body);border:1px solid var(--ink);background:var(--paper);padding:6px 9px;cursor:pointer}
.tb{border:1px solid var(--ink);display:grid;grid-template-columns:auto auto;font:400 11px/1.35 var(--mono);min-width:280px}
.tb div{padding:6px 9px;border-bottom:1px solid var(--rule)}
.tb div:nth-child(even){color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-right:1px solid var(--rule)}
.tb .ttl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.tb .ttl b{font:700 14px/1.1 var(--display);font-stretch:80%;text-transform:uppercase}
.north{width:30px;height:30px}
.scale{display:none;align-items:center;gap:6px}
.scale i{display:block;height:6px;border:1px solid var(--ink);border-top:0;width:60px;background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.plan .scale{display:inline-flex}
.note{grid-column:1/-1;font:400 12.5px/1.5 var(--mono);color:var(--muted)}

/* sun study */
.tabs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.heat{grid-column:1/span 8;overflow-x:auto}
.hm{display:grid;grid-template-columns:44px repeat(16,minmax(26px,1fr));gap:3px;min-width:560px;font:400 11px/1 var(--mono)}
.hm .hd{color:var(--muted);text-align:center;padding-bottom:4px}
.hm .mo{color:var(--muted);align-self:center}
.hm button{height:30px;border:0;padding:0;cursor:pointer;background:var(--paper-2);position:relative}
.hm button.night{background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(20,26,24,.08) 3px 4px);cursor:default}
.hm button:hover:not(.night),.hm button:focus-visible{outline:2px solid var(--ink);outline-offset:0;z-index:1}
.legend{display:flex;align-items:center;gap:8px;font:400 11.5px/1 var(--mono);color:var(--muted);margin-top:12px}
.legend i{display:block;width:140px;height:8px;background:linear-gradient(90deg,#E5E7E1,#F3D27A,#E89A1A,#B85C0C)}
.sunside{grid-column:9/span 4;display:grid;gap:14px;align-content:start}
.big{font:700 clamp(44px,5vw,72px)/.9 var(--display);font-stretch:74%;font-variant-numeric:tabular-nums}
.tip{min-height:3.2em;font:400 13px/1.5 var(--mono);color:var(--ink);border-left:3px solid var(--accent);padding-left:10px}

/* mortgage */
.calc{grid-column:1/span 7;display:grid;gap:18px}
.field{display:grid;gap:8px}
.field .lab{display:flex;justify-content:space-between;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .lab output{font:600 15px/1 var(--mono);color:var(--ink);letter-spacing:0;text-transform:none}
.field input[type=range]{width:100%;accent-color:var(--ink)}
.result{grid-column:8/span 5;background:var(--ink);color:var(--paper);padding:26px;display:grid;gap:12px;align-content:start}
.result .big{color:var(--accent)}
.result .row2{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(241,242,238,.18);padding-top:10px;font:400 13px/1.4 var(--mono)}
.result .s{font:400 12px/1.5 var(--mono);color:rgba(241,242,238,.6)}

/* place + company */
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
.fact{padding:18px 18px 22px 0;border-right:1px solid var(--rule);display:grid;gap:8px;align-content:start}
.fact+.fact{padding-left:18px}.fact:last-child{border-right:0}
.fact b{font:700 clamp(32px,3.6vw,52px)/1 var(--display);font-stretch:74%;font-variant-numeric:tabular-nums}
.fact>span{font-size:14.5px;color:var(--muted);max-width:26ch}
.fact b.sm{font-size:clamp(26px,2.8vw,42px);white-space:nowrap;align-self:end}
.princ{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink)}
.pr{padding:18px 20px 18px 0;display:grid;gap:10px;align-content:start;transition:background .3s}
.pr+.pr{padding-left:20px;border-left:1px solid var(--rule)}
.pr:hover{background:var(--paper-2)}
.pr .ods{font:500 11.5px/1 var(--mono);letter-spacing:.08em;display:inline-flex;align-items:center;gap:8px}
.pr .ods::before{content:"";width:10px;height:10px;background:var(--accent)}
.pr h3{font-size:22px;font-stretch:82%;text-transform:uppercase;line-height:1.05}
.pr p{font-size:15.5px;color:var(--muted)}
.src{grid-column:1/-1;font:400 12px/1.5 var(--mono);color:var(--muted)}
footer{padding-block:28px 40px;display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;font:400 12.5px/1.5 var(--mono);color:var(--muted)}

.viewer:fullscreen{display:flex;flex-direction:column;background:var(--paper)}
.viewer:fullscreen .stage{flex:1;height:auto}
@media (max-width:1100px){.bar{grid-template-columns:1fr 1fr}.bar .sun{grid-column:1/-1;grid-row:1}}
@media (max-width:860px){
  .block h2,.lede,.heat,.sunside,.calc,.result{grid-column:1/-1}
  .facts,.princ{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fact:nth-child(2){border-right:0}.fact:nth-child(3){padding-left:0}.fact:nth-child(n+3){border-top:1px solid var(--rule)}
  .pr:nth-child(3){padding-left:0;border-left:0}.pr:nth-child(n+3){border-top:1px solid var(--rule)}
  .bar{grid-template-columns:1fr}.bar .sun{grid-row:auto}
  .nav a:not(.cta){display:none}
  .chapter{align-items:flex-end}
  .card{max-width:none;padding:20px}
  .rail{display:none}
  .sticky::after{background:linear-gradient(0deg,rgba(14,20,18,.6),rgba(14,20,18,0) 50%)}
  .stage{height:clamp(380px,62vh,620px)}
  .tb{min-width:0}
}
@media (max-width:480px){
  .brand span{display:none}.brand b{font-size:17px}
  .facts,.princ{grid-template-columns:1fr}
  .fact,.fact+.fact,.pr,.pr+.pr{border-right:0;border-left:0;padding-left:0;border-top:1px solid var(--rule)}
}
.planfig{grid-column:1/span 8;margin:0;background:#fff;border:1px solid var(--rule)}
.planfig svg{display:none;width:100%;height:auto}.planfig svg.on{display:block}
.planside{grid-column:9/span 4;display:grid;gap:14px;align-content:start}
.pside{display:none}.pside.on{display:block}
.pside h3{font:700 26px/1.1 var(--display);font-stretch:80%;margin:0 0 10px}
.pside p{margin:0 0 12px;max-width:42ch}.pside ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.pside li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.dl-pdf{justify-self:start;font:600 14px/1 var(--body);color:var(--ink);background:var(--accent);padding:12px 16px;text-decoration:none}
@media (max-width:860px){.planfig,.planside{grid-column:1/-1}}
.hintline{font:400 12px/1.5 var(--mono);color:var(--muted)}
.poster{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:400 14px/1.5 var(--mono);color:var(--paper)}
.stage .fallback{color:var(--ink)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.hm button.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.hm .mo.on{color:var(--ink);font-weight:600}
.sunside .mono{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.result .mono{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(241,242,238,.7)}
.tabs .chip{font-size:12.5px;padding:9px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
